<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Arcade Shooter</title><style>body{margin:0;background:#101820;color:white;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(94vw,800px);position:relative}canvas{width:100%;aspect-ratio:4/3}#view{position:absolute;inset:5%;background:#102331e8;color:#e8f5ff;pointer-events:none}.arena{position:absolute;inset:0;background:radial-gradient(ellipse at center,#234a60,#102331)}.player,.enemy,.projectile{position:absolute;transform:translate(-50%,-50%);border-radius:50%}.player{width:4%;aspect-ratio:1;background:#61d6ff;border:2px solid #e8f5ff;box-shadow:0 0 16px #61d6ff}.enemy{width:4.5%;aspect-ratio:1;background:#ff6d72;border:2px solid #ffe0c4}.projectile{width:1.5%;aspect-ratio:1;background:#fff18a;box-shadow:0 0 8px #fff18a}.hud{position:absolute;left:10px;top:8px;font:13px monospace}</style><body><main><canvas id="GameCanvas" width="800" height="600"></canvas><div id="view"></div><p>Arrows move · Space fire · R restart · P pause</p></main><script type="module" src="main.mjs"></script></body></html>
