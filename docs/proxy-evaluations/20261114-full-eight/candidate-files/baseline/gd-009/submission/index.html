<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sokoban</title><style>body{margin:0;background:#151d25;color:#edf4f2;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(94vw,800px);position:relative}canvas{display:block;width:100%;aspect-ratio:4/3}#view{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.board{display:grid;grid-template-columns:repeat(7,54px);gap:3px;background:#24313b;padding:10px;border-radius:8px}.cell{width:54px;height:54px;display:grid;place-items:center;font-size:28px;background:#364651;border-radius:4px}.wall{background:#17232c}.goal:before{content:'·';color:#f5d36e;position:absolute;font-size:40px}.cell{position:relative}button{pointer-events:auto}#help{text-align:center;color:#cad5d5}</style><body><main><canvas id="GameCanvas" width="800" height="600"></canvas><div id="view"></div><p id="help">Arrow keys move · R restart · P pause</p></main><script type="module" src="main.mjs"></script></body></html>
