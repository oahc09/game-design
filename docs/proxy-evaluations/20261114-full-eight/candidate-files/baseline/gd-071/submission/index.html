<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Platformer</title><style>body{margin:0;background:#101820;color:white;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(94vw,800px);position:relative}canvas{width:100%;aspect-ratio:4/3}#view{position:absolute;inset:5%;background:#183244dd;color:#eff;overflow:hidden}.world{position:absolute;inset:0;background:linear-gradient(#132b3b66,#132b3b22)}.platform{position:absolute;background:#d6b77a;border:1px solid #ffe3a1;box-sizing:border-box}.capsule{position:absolute;width:1.95%;height:6.67%;border:2px solid #fff3d1;border-radius:999px;background:#ffbc57;box-sizing:border-box}.capsule.grounded{box-shadow:0 0 0 2px #7ef0bd}.checkpoint{position:absolute;width:2%;height:5%;border-left:3px solid #e4f4ff;border-right:3px solid #e4f4ff;border-radius:50%}.readout{position:absolute;left:10px;top:8px;font:12px monospace;color:#eff;white-space:pre}</style><body><main><canvas id="GameCanvas" width="800" height="600"></canvas><div id="view"></div><p>←/→ move · Space jump · C checkpoint · R restart · P pause</p></main><script type="module" src="main.mjs"></script></body></html>
