<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Design · Evidence Lab</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:,"></head><body><main><header><div><p class="eyebrow">GAME DESIGN SYSTEM / PLAYTEST</p><h1>玩法验证实验室</h1><p>同一份规则，从参考运行时到真实引擎。</p></div><div class="engine" id="engine">启动 CocosAirJS…</div></header><section class="layout"><div class="stage"><div class="stagebar"><select id="archetype" aria-label="游戏原型"><option value="sokoban">推箱子 · Sokoban</option><option value="falling_blocks">下落方块 · Falling Blocks</option><option value="arcade_shooter">街机射击 · Arcade Shooter</option><option value="merge2048">合成 2048</option><option value="match3">三消 · Match-3</option><option value="block_puzzle">方块拼图 · Block Puzzle</option></select><select id="difficulty" aria-label="配置阶段"><option value="teaching">冻结教学</option><option value="challenge">冻结挑战</option><option value="reference">参考示例</option></select><span id="status">READY</span></div><div class="controls"><button id="restart">重新开始</button><button id="pause">开始</button><button id="step">策略单步</button><button id="bot" aria-pressed="false">策略辅助</button></div><p id="help"></p><p id="config-summary"></p><p id="input-feedback" aria-live="polite"></p><div id="piece-tray" aria-label="可放置方块" hidden></div><div id="GameDiv"><canvas id="GameCanvas" tabindex="0" aria-label="游戏画面"></canvas></div><div id="touch-controls"><button data-action="UP">↑</button><button data-action="LEFT">←</button><button data-action="DOWN">↓</button><button data-action="RIGHT">→</button><button data-action="FIRE">发射 / 落下</button></div></div><aside><h2>运行证据</h2><div class="fact"><span>SEED</span><input id="seed" type="number" value="42" min="0" max="4294967295" aria-label="随机种子"></div><div class="fact"><span>TICK</span><strong id="tick">0</strong></div><div class="fact"><span>STATE HASH</span><code id="hash">—</code></div><div class="fact"><span>TRANSITIONS</span><strong id="transitions">0</strong></div><h3>实时事件</h3><pre id="events">等待输入</pre><h3>验收边界</h3><p>冻结配置来自合成策略校准。策略辅助和策略单步会标记为辅助记录；手动输入本身不能证明真人参与。</p><button id="download">导出体验记录</button></aside></section><p id="error" role="alert"></p><footer>SHARED RULES · SEEDED SIMULATION · REPLAYABLE EVIDENCE</footer></main><script type="module" src="app.mjs"></script></body></html>
