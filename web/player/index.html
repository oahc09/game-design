<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>可玩游戏</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div><span class="eyebrow">ORBIT / LITTLE ARCADE</span><h1 id="title"></h1></div><button id="pause" aria-label="暂停游戏">Ⅱ</button></header>
<section class="hud" aria-live="polite"><div><small id="stage-label">航线</small><strong id="stage">01 / 03</strong></div><div><small id="goal-label">目标</small><strong id="goal">—</strong></div><div><small id="score-label">得分</small><strong id="score">0000</strong></div></section>
<div class="playfield" id="GameDiv"><canvas id="GameCanvas" tabindex="0" aria-label="游戏画面"></canvas><div id="overlay"><p class="eyebrow" id="overlay-kicker"></p><h2 id="overlay-title"></h2><p id="description"></p><div id="levels"></div><button class="primary" id="start-btn">开始挑战 →</button><button id="restart" hidden>重新开始</button><button id="menu-btn" hidden>关卡选择</button></div><div id="toast" role="status"></div></div>
<div id="tray" hidden></div><nav id="touch" aria-label="触屏操作"><button data-key="ArrowLeft" aria-label="向左">←</button><button data-key="ArrowUp" aria-label="向上">↑</button><button data-key="ArrowDown" aria-label="向下">↓</button><button data-key="ArrowRight" aria-label="向右">→</button><button data-key=" " id="fire">开火</button></nav>
<footer><span id="hint"></span><button id="fullscreen" aria-label="切换全屏">↗ 全屏</button></footer><p id="error" role="alert" hidden></p></main><script type="module" src="player.mjs"></script></body></html>
